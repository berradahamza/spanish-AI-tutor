<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spanish AI - Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- THEME COMMUN --- */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .sagrada-light-bg {
            background-color: #fffbf5;
            background-image: 
                radial-gradient(at 20% 30%, hsla(45, 100%, 85%, 0.4) 0px, transparent 50%),
                radial-gradient(at 80% 10%, hsla(200, 100%, 85%, 0.3) 0px, transparent 50%),
                radial-gradient(at 50% 80%, hsla(10, 100%, 90%, 0.4) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .sagrada-header-texture {
            background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.07' fill-rule='evenodd'%3E%3Ccircle cx='3' cy='3' r='3'/%3E%3Ccircle cx='13' cy='13' r='3'/%3E%3C/g%3E%3C/svg%3E");
        }

        .organic-shape {
            border-radius: 45% 55% 70% 30% / 30% 60% 40% 70%;
        }

        .card-hover:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body class="bg-orange-50 h-screen flex justify-center overflow-hidden font-sans">

    <div class="w-full max-w-md h-full bg-white flex flex-col shadow-xl relative">

        <header class="bg-red-800 sagrada-header-texture text-white p-6 pb-28 rounded-b-[2.5rem] shadow-lg z-10 relative overflow-hidden">
            
            <div class="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full -mr-10 -mt-10 blur-xl"></div>
            
            <div class="flex items-center justify-between relative z-20">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 organic-shape bg-white flex items-center justify-center shrink-0 border-2 border-amber-400 shadow-md overflow-hidden">
                        <img src="mustache.png" alt="User" class="w-full h-full object-contain p-1.5 opacity-90">
                    </div>
                    <div>
                        <p class="text-red-200 text-xs font-medium uppercase tracking-wider mb-0.5">Hola,</p>
                        <h1 class="font-bold text-2xl leading-none">Estudiante</h1>
                    </div>
                </div>

                <div class="flex items-center gap-2 bg-red-900/40 backdrop-blur-md px-3 py-1.5 rounded-full border border-red-500/30 shadow-sm">
                    <i class="fa-solid fa-fire text-amber-400 animate-pulse"></i>
                    <span class="font-bold text-sm">3 jours</span>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto px-6 pb-6 -mt-16 space-y-5 sagrada-light-bg no-scrollbar z-20 pt-2">
            
            <a href="setup.html" class="block bg-white p-6 rounded-3xl shadow-xl border border-white/50 card-hover transition transform relative overflow-hidden group">
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <h2 class="text-gray-800 font-bold text-xl">Conversation du jour</h2>
                        <p class="text-gray-500 text-sm mt-1">Thème : Le Restaurant</p>
                    </div>
                    <div class="w-12 h-12 bg-red-50 rounded-full flex items-center justify-center text-red-600 group-hover:bg-red-600 group-hover:text-white transition duration-300">
                        <i class="fa-solid fa-comments text-xl"></i>
                    </div>
                </div>
                
                <div class="mt-6">
                    <div class="flex justify-between text-xs font-bold mb-2">
                        <span class="text-gray-400 uppercase tracking-wide">Objectif Mots</span>
                        <span class="text-red-600 bg-red-50 px-2 py-0.5 rounded-md">0 / 10</span>
                    </div>
                    <div class="w-full h-3 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-red-500 to-amber-500 w-[5%] rounded-full shadow-[0_0_10px_rgba(239,68,68,0.5)]"></div>
                    </div>
                </div>
                
                <div class="mt-5 inline-flex items-center gap-2 text-sm font-bold text-red-700 group-hover:gap-3 transition-all">
                    C'est parti <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>

            <div class="grid grid-cols-2 gap-4">
                
                <a href="dico.html" class="bg-white p-5 rounded-3xl shadow-lg border border-white/50 flex flex-col items-center text-center gap-3 card-hover transition hover:shadow-xl">
                    <div class="w-14 h-14 organic-shape bg-amber-50 flex items-center justify-center text-amber-500 mb-1 shadow-sm">
                        <i class="fa-solid fa-book-open text-2xl"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800">Dictionnaire</h3>
                        <p class="text-xs text-gray-400 font-medium mt-0.5">142 mots appris</p>
                    </div>
                </a>

                <a href="revision.html" class="bg-white p-5 rounded-3xl shadow-lg border border-white/50 flex flex-col items-center text-center gap-3 card-hover transition hover:shadow-xl">
                    <div class="w-14 h-14 organic-shape bg-green-50 flex items-center justify-center text-green-600 mb-1 shadow-sm">
                        <i class="fa-solid fa-dumbbell text-2xl"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800">Révisions</h3>
                        <p class="text-xs text-gray-400 font-medium mt-0.5">Exos & Quiz</p>
                    </div>
                </a>

            </div>

            <div class="bg-white/60 backdrop-blur-md p-5 rounded-3xl border border-white shadow-sm mt-4">
                <h3 class="text-gray-800 font-bold mb-4 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-gray-400"></i> Préférences
                </h3>
                
                <div class="flex items-center justify-between">
                    <span class="text-sm text-gray-600 font-medium">Mots par jour</span>
                    <div class="flex items-center gap-1 bg-white p-1 rounded-xl border border-gray-200 shadow-sm">
                        <button id="btn-minus" class="w-8 h-8 flex items-center justify-center rounded-lg text-red-400 hover:bg-red-50 hover:text-red-600 transition">
                            <i class="fa-solid fa-minus"></i>
                        </button>
                        
                        <span id="daily-count" class="font-bold text-gray-800 w-6 text-center text-sm">10</span>
                        
                        <button id="btn-plus" class="w-8 h-8 flex items-center justify-center rounded-lg text-green-500 hover:bg-green-50 hover:text-green-700 transition">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="h-4"></div> </main>

        <footer class="py-4 text-center text-[10px] text-red-300 font-medium uppercase tracking-widest bg-white z-20">
            Spanish AI Tutor • Beta 1.0
        </footer>

    </div>
    <script>
    // --- GESTION DU COMPTEUR DE MOTS ---
    const countSpan = document.getElementById('daily-count');
    const btnMinus = document.getElementById('btn-minus');
    const btnPlus = document.getElementById('btn-plus');

    // 1. Récupérer la valeur sauvegardée (ou 10 par défaut)
    let currentCount = localStorage.getItem('dailyWordGoal') ? parseInt(localStorage.getItem('dailyWordGoal')) : 10;
    countSpan.innerText = currentCount;

    // 2. Fonction pour mettre à jour
    function updateCount(value) {
        currentCount = value;
        countSpan.innerText = currentCount;
        // On sauvegarde dans le navigateur pour qu'il s'en souvienne au prochain rechargement
        localStorage.setItem('dailyWordGoal', currentCount);
    }

    // 3. Écouteurs d'événements (Clics)
    btnMinus.addEventListener('click', () => {
        if (currentCount > 5) { // Minimum 5 mots
            updateCount(currentCount - 1); // On enlève 1 (ou tu peux mettre -5)
        }
    });

    btnPlus.addEventListener('click', () => {
        if (currentCount < 50) { // Maximum 50 mots
            updateCount(currentCount + 1); // On ajoute 1
        }
    });
</script>
</body>
</html>
